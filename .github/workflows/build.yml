name: Build PS3 SPRX Client

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-ps3:
    runs-on: ubuntu-latest
    container:
      image: ps3dev/ps3dev:submodules

    env:
      PS3DEV: /usr/local/ps3dev
      PSL1GHT: /usr/local/ps3dev
      PATH: /usr/local/ps3dev/bin:/usr/local/ps3dev/ppu/bin:/usr/local/ps3dev/spu/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Compilar y empaquetar SPRX
        run: |
          if [ -d "GTAClient_PS3" ]; then
            cd GTAClient_PS3
            make

            echo "=== Archivos generados ==="
            ls -la

            # Buscar cualquier binario resultante (.prx, .sprx, .elf, .felf)
            BIN_FILE=$(find . -maxdepth 1 -type f \( -name "*.prx" -o -name "*.sprx" -o -name "*.elf" -o -name "*.felf" \) | head -n 1)

            if [ -n "$BIN_FILE" ]; then
              echo "Binario detectado: $BIN_FILE"
              cp "$BIN_FILE" GTAClient.sprx
              cp "$BIN_FILE" GTAClient.prx
            else
              echo "Error: No se genero ningun ejecutable tras compilar."
              exit 1
            fi
          else
            echo "Error: La carpeta 'GTAClient_PS3' no existe."
            exit 1
          fi

      - name: Subir artefactos compilados
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GTAClient-PS3-SPRX
          if-no-files-found: error
          path: |
            GTAClient_PS3/GTAClient.sprx
            GTAClient_PS3/GTAClient.prx
