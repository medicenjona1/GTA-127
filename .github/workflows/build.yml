name: Build PS3 SPRX Client

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-ps3:
    runs-on: ubuntu-latest
    container:
      image: zeldin/ps3dev-docker:latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Compilar SPRX para PS3
        run: |
          cd GTAClient_PS3
          make clean
          make

      - name: Subir binario .sprx generado
        uses: actions/upload-artifact@v4
        with:
          name: GTAClient-PS3-SPRX
          path: |
            GTAClient_PS3/*.sprx
            GTAClient_PS3/*.prx
