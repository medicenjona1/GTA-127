name: Build PS3 SPRX Client

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-ps3:
    runs-on: ubuntu-latest
    container:
      image: ps3dev/ps3dev:submodules

    env:
      PS3DEV: /usr/local/ps3dev
      PSL1GHT: /usr/local/ps3dev
      PATH: /usr/local/ps3dev/bin:/usr/local/ps3dev/ppu/bin:/usr/local/ps3dev/spu/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Compilar SPRX para PS3
        run: |
          if [ -d "GTAClient_PS3" ]; then
            cd GTAClient_PS3
            make
            ls -la
          else
            echo "Error: La carpeta 'GTAClient_PS3' no existe en el repositorio."
            exit 1
          fi

      - name: Subir binarios generados
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GTAClient-PS3-SPRX
          path: |
            GTAClient_PS3/*.sprx
            GTAClient_PS3/*.prx
            GTAClient_PS3/*.elf
