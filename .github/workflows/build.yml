name: Build PS3 SPRX Client

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-ps3:
    runs-on: ubuntu-latest
    container:
      image: hldtux/ps3dev:latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Verificar y compilar SPRX para PS3
        run: |
          if [ -d "GTAClient_PS3" ]; then
            cd GTAClient_PS3
            make clean
            make
          else
            echo "Error: La carpeta 'GTAClient_PS3' no existe en el repositorio."
            exit 1
          fi

      - name: Subir binario .sprx generado
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GTAClient-PS3-SPRX
          path: |
            GTAClient_PS3/*.sprx
            GTAClient_PS3/*.prx
